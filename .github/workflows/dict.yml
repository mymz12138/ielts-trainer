name: 更新词典数据

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 每日 UTC 1:00（北京时间 9:00）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取词典数据
        run: node scripts/fetch-dict.mjs
      - name: 提交变更
        run: |
          if [[ -n $(git status --porcelain data/dict.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dict.json
            git commit -m "chore: 更新词典数据"
            git push
          else
            echo "无变化，跳过提交"
          fi
