<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="雅思备考训练工具：分级真题训练、高频考点速记、错题自动收录、每日单词打卡、自定义复习计划">
<title>雅思备考训练 · IELTS Trainer</title>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<!-- ===== 桌面端侧边栏 ===== -->
<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <div class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    </div>
    <div class="brand-text">
      <strong>IELTS Trainer</strong>
      <span>雅思备考训练</span>
    </div>
  </div>
  <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
  <div class="side-foot">
    <button class="theme-toggle" id="themeToggle" type="button" title="切换深浅模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>护眼浅色</span>
    </button>
    <p class="side-note">数据保存在本机浏览器<br>换设备请自行迁移</p>
  </div>
</aside>

<!-- ===== 移动端顶栏 ===== -->
<header class="mobile-topbar">
  <div class="mtb-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    <strong>IELTS Trainer</strong>
  </div>
  <button class="theme-toggle icon-only" id="themeToggleM" type="button" title="切换深浅模式">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<!-- ===== 主内容区 ===== -->
<main class="main" id="main" tabindex="-1"></main>

<!-- ===== 移动端底部导航 ===== -->
<nav class="bottom-nav" id="bottomNav" aria-label="底部导航"></nav>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script src="js/data-vocab.js?v=4"></script>
<script src="js/data-bank.js?v=4"></script>
<script src="js/data-notes.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
